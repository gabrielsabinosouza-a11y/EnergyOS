tools:
    shell:
        allow:
            - cd *
            - ls *
            - echo *
            - cat *
            - head *
            - find *
            - tail *
            - grep *
            - sort
            - wc *
            - xargs *
            - sed *
            - git log *
            - timeout 120 npx tsc *
            - npm test
            - timeout 60 npx eslint *
            - timeout 90 npm *
            - node_modules/.bin/tsc *
            - test *
            - timeout 120 *
            - timeout 60 node *
            - sort *
            - bash *
            - timeout 150 *
            - source *
            - node *
            - npx tsc *
            - npx eslint *
            - rm *
            - git status *
            - git diff *
            - git diff HEAD *
            - sleep 28
            - git stash *
            - git show *
