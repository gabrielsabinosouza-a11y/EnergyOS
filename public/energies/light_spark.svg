<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><defs>
  <radialGradient id="bglightsp" cx="50%" cy="60%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bodylightsp" cx="40%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#f9a825" stop-opacity="1"/>
    <stop offset="100%" stop-color="#fff9c4" stop-opacity="1"/>
  </radialGradient>
  <filter id="glowlightsp" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
