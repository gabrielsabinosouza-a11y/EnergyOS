<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><defs>
  <radialGradient id="bgshadowsp" cx="50%" cy="60%" r="50%">
    <stop offset="0%" stop-color="#ce93d8" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#ce93d8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bodyshadowsp" cx="40%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#512da8" stop-opacity="1"/>
    <stop offset="100%" stop-color="#b39ddb" stop-opacity="1"/>
  </radialGradient>
  <filter id="glowshadowsp" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglowshadowsp" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
  <ellipse cx="60" cy="90" rx="28" ry="8" fill="#ce93d8" opacity="0.18"/>
  <ellipse cx="60" cy="88" rx="14" ry="5" fill="#ce93d8" opacity="0.28"/>
  <circle cx="60" cy="72" r="16" fill="url(#bodyshadowsp)" filter="url(#glowshadowsp)" opacity="0.9"/>
  <circle cx="60" cy="72" r="8" fill="#512da8" opacity="0.7"/>
  <circle cx="55" cy="67" r="3" fill="white" opacity="0.5"/>
  <circle cx="60" cy="52" r="4" fill="#ce93d8" filter="url(#softglowshadowsp)" opacity="0.7"/>
  <circle cx="52" cy="58" r="2.5" fill="#ce93d8" opacity="0.5"/>
  <circle cx="68" cy="56" r="2" fill="#ce93d8" opacity="0.4"/>
</svg>