<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="cosmicGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="cosmicGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="55" stroke="url(#cosmicGrad)" stroke-width="4" fill="none" filter="url(#cosmicGlow)" opacity="0.9"/>
  <circle cx="60" cy="60" r="49" stroke="#c084fc" stroke-width="1.5" fill="none" opacity="0.25" stroke-dasharray="10 5 3 5"/>
  <circle cx="60" cy="60" r="43" stroke="#a855f7" stroke-width="0.6" fill="none" opacity="0.15"/>
</svg>
