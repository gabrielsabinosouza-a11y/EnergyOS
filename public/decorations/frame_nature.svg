<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="natureGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="natureGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="53" stroke="url(#natureGrad)" stroke-width="3.5" fill="none" filter="url(#natureGlow)" opacity="0.85"/>
  <circle cx="60" cy="60" r="48" stroke="#4ade80" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="4 8"/>
</svg>
