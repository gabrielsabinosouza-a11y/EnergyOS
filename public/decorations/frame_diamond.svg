<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="diamondGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#71d4ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="diamondGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="56" stroke="url(#diamondGrad)" stroke-width="5" fill="none" filter="url(#diamondGlow)" opacity="0.95"/>
  <circle cx="60" cy="60" r="50" stroke="#e0f2fe" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="15 3"/>
  <circle cx="60" cy="60" r="44" stroke="#71d4ff" stroke-width="0.8" fill="none" opacity="0.2"/>
</svg>
