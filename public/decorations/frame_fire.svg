<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="fireGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#ffb86b"/>
    </linearGradient>
    <filter id="fireGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" stroke="url(#fireGrad)" stroke-width="4" fill="none" filter="url(#fireGlow)" opacity="0.9"/>
  <circle cx="60" cy="60" r="48" stroke="#ff6b35" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="8 4"/>
</svg>
